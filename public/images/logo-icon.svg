<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer hexagon outline -->
  <path d="M50 8 L88 30 L88 70 L50 92 L12 70 L12 30 Z" stroke="#0088CC" stroke-width="4" fill="none" stroke-linejoin="round"/>
  
  <!-- Thin white roof (top face) - matches outline weight -->
  <path d="M50 8 L86.5 29.2 L50 48 L13.5 29.2 Z" fill="#FFFFFF"/>
  
  <!-- Very subtle side shading -->
  <path d="M88 30 L88 70 L50 92 L50 50 Z" fill="#0088CC" fill-opacity="0.08"/>
  <path d="M12 30 L12 70 L50 92 L50 50 Z" fill="#000000" fill-opacity="0.12"/>
  
  <!-- Lightning bolt -->
  <path d="M57 28 L40 51 L48 51 L43 72 L62 46 L52 46 L57 28 Z" fill="#0088CC"/>
</svg>
